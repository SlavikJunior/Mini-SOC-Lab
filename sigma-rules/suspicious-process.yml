title: PowerShell With Encoded Command Switch
id: 3b9e17ac-7b30-4a5a-8c2f-7e2e9f8d0012
status: experimental
description: Detects a process command line containing PowerShell's EncodedCommand switch. Validate the parent process and command context before treating it as malicious.
author: Mini SOC Lab
date: 2026/10/21
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\powershell.exe'
    selection_command:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
    condition: selection_image and selection_command
falsepositives:
    - Legitimate administrative scripts
    - Software deployment tools
level: medium
tags:
    - attack.execution
    - attack.t1059.001
